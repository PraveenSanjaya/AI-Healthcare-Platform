services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic
      POSTGRES_DB: clinicassist
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinicassist"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    profiles: ["tools"]   # opt-in: docker compose --profile tools up -d
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  pgdata:
